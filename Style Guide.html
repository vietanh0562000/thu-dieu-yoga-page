<!DOCTYPE html>

<head>

body{margin:0;background:var(--paper);color:var(--text-body);font-family:var(--font-sans);letter-spacing:var(--ls-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--forest-800)}a:hover{color:var(--ink-900)}
.row-hover:hover{background:var(--surface-tint)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script>
const { Eyebrow, Button, IconButton, PlayButton, Icon, Input, ClassCard, NavBar, Wordmark } = window.ThuDiUYogaDesignSystem_fdebe5;

// Lets the markup keep CSS-string styles like the design source: "a:b;c:d" -> { a: 'b', c: 'd' }
const toStyle = s => Object.fromEntries(s.split(';').filter(d => d.includes(':')).map(d => {
  const i = d.indexOf(':');
  return [d.slice(0, i).trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase()), d.slice(i + 1).trim()];
}));
const h = (t, p, ...c) => React.createElement(t, p && typeof p.style === 'string' ? { ...p, style: toStyle(p.style) } : p, ...c);
const html = htm.bind(h);

const lum = hex => {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
};
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

const swatches = [
  ['Paper', '#fafbf8', '--paper', 'Page'],
  ['Sage 50', '#f1f8ee', '--sage-50', 'Tinted cards'],
  ['Sage 100', '#e5ece2', '--sage-100', 'Card footers'],
  ['Sage 200', '#cfdecb', '--sage-200', 'Photo placeholders'],
  ['Sage 300', '#a8c8a4', '--sage-300', 'Primary action'],
  ['Sage 700', '#4e594a', '--sage-700', 'Muted text'],
  ['Forest 800', '#2b3a2c', '--forest-800', 'Headings'],
  ['Ink 900', '#141a12', '--ink-900', 'Body, dark CTA, footer'],
  ['Star', '#fcc805', '--star', 'The one accent'],
  ['Error', '#c2553f', '--error', 'Form errors only'],
].map(([name, color, token, use]) => ({ name, color, token, use }));

const contrast = [
  ['#141a12', '#fafbf8', 'Ink 900 on Paper'],
  ['#2b3a2c', '#fafbf8', 'Forest 800 on Paper'],
  ['#4e594a', '#fafbf8', 'Sage 700 on Paper'],
  ['#4e594a', '#e5ece2', 'Sage 700 on Sage 100'],
  ['#1e3717', '#a8c8a4', 'Button text on Sage 300'],
  ['#fdfffc', '#405940', 'White on Forest 700'],
  ['#c2553f', '#fafbf8', 'Error on Paper'],
  ['#6a8466', '#fafbf8', 'Sage 600 on Paper'],
  ['#a8aaa6', '#fafbf8', 'Gray 400 on Paper'],
].map(([fg, bg, label]) => {
  const r = ratio(fg, bg);
  const pass = r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'Large text only' : 'Fails';
  return { fg, bg, label, ratio: r.toFixed(1) + ':1', pass, passColor: r >= 4.5 ? '#405940' : '#c2553f' };
});

const chipLabels = ['All Levels', 'Beginner', 'Intermediate', 'Advanced', 'Hatha', 'Vinyasa', 'Yin'];
const navLinks = ['Classes', 'About', 'Log In'];
const note = 'font-size:13px;color:var(--sage-700)';
const typeLabel = 'font-size:13px;line-height:1.4;color:var(--sage-700)';
const typeRow = 'display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:24px;align-items:baseline;padding:28px 0;border-top:1px solid var(--line)';
const glass = 'background:rgba(253,255,252,.42);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);border:1px solid rgba(253,255,252,.35)';

function StyleGuide() {
  const [chip, setChip] = React.useState('All Levels');
  const [menuOpen, setMenuOpen] = React.useState(true);
  const [showPw, setShowPw] = React.useState(false);

  return html`
<div style="max-width:var(--container-max);margin:0 auto;padding:clamp(32px,6vw,80px) clamp(20px,6vw,64px) 120px;display:flex;flex-direction:column;gap:clamp(80px,11vw,140px)">

<header style="display:flex;flex-direction:column;gap:28px;max-width:820px">
  <${Eyebrow}>Style Guide · V2<//>
  <h1 style="margin:0;font-family:var(--font-sans);font-weight:var(--fw-light);font-size:clamp(48px,9vw,116px);line-height:var(--lh-display);letter-spacing:var(--ls-display);color:var(--forest-800)">Colour, Type & Components</h1>
  <p style="margin:0;font-size:clamp(18px,2vw,var(--fs-lead));line-height:1.5;letter-spacing:-.03em;color:var(--forest-800);max-width:680px;text-wrap:pretty">Rebuilt on the Thu Diệu Yoga design system. <span style="color:var(--sage-700)">Sage and paper carry the calm, forest and ink do the reading, and star gold is the single accent.</span></p>
</header>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>01 · Colour<//>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px">
    ${swatches.map(s => html`
    <div key=${s.token} style="display:flex;flex-direction:column;gap:10px">
      <div style="height:112px;border-radius:var(--radius-sm);background:${s.color};border:1px solid var(--line)"></div>
      <div style="font-size:var(--fs-small);font-weight:var(--fw-semibold);color:var(--ink-900)">${s.name}</div>
      <div style="font-size:13px;line-height:1.4;color:var(--sage-700)">${s.token}<br/>${s.use}</div>
    </div>`)}
  </div>
  <div style="background:var(--surface-tint);border-radius:var(--radius-sm);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:18px">
    <div style="font-size:var(--fs-body-lg);font-weight:var(--fw-medium);color:var(--ink-900)">Text contrast <span style="font-weight:var(--fw-regular);color:var(--sage-700)">— AA needs 4.5:1 for body text, 3:1 for large headlines</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px">
      ${contrast.map(c => html`
      <div key=${c.label} style="display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--radius-sm);padding:10px 12px">
        <div style="flex:none;width:44px;height:44px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:var(--fw-medium);background:${c.bg};color:${c.fg}">Aa</div>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:13px;line-height:1.3;color:var(--ink-900)">${c.label}</span><span style="font-size:13px;font-weight:var(--fw-semibold);color:${c.passColor}">${c.ratio} · ${c.pass}</span></div>
      </div>`)}
    </div>
    <p style="margin:0;font-size:var(--fs-small);line-height:1.5;color:var(--sage-700);max-width:720px">Gray 400 is too light for text on paper, so muted copy will use Sage 700 instead. Sage 600 is kept for large type and accents only.</p>
  </div>
</section>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>02 · Type<//>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px">
    <div style="background:var(--sage-100);border-radius:var(--radius-sm);padding:32px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:112px;line-height:1;font-weight:var(--fw-light);letter-spacing:var(--ls-display);color:var(--forest-800)">Aa</span>
      <span style="font-size:var(--fs-h4);font-weight:var(--fw-semibold);letter-spacing:var(--ls-heading);color:var(--ink-900)">Hanken Grotesk</span>
      <span style="font-size:var(--fs-small);line-height:1.5;color:var(--sage-700)">The only typeface. Light 300 for large headlines, Regular 400 and Medium 500 for text, Semibold 600 and Bold 700 for card titles and labels. Includes Vietnamese.</span>
    </div>
    <div style="background:var(--surface-tint);border-radius:var(--radius-sm);padding:32px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px">
      <span style="font-size:34px;line-height:1.2;font-weight:var(--fw-regular);letter-spacing:var(--ls-heading);color:var(--forest-800)">ÀÁẢÃẠ Thu Diệu</span>
      <span style="font-size:var(--fs-body);line-height:1.5;color:var(--sage-700)">Aa Bb Cc Dd Ee Ff Gg Hh Ii Jj Kk Ll Mm<br/>0123456789 · 4.9/5 · 125+</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column">
    <div style=${typeRow}><span style=${typeLabel}>Display<br/>300 · 116 / 0.94</span><span style="font-size:clamp(48px,8vw,var(--fs-display));line-height:var(--lh-display);font-weight:var(--fw-light);letter-spacing:var(--ls-display);color:var(--forest-800)">Breathe, Then Begin</span></div>
    <div style=${typeRow}><span style=${typeLabel}>Heading<br/>400 · 34 / 1.15</span><span style="font-size:clamp(28px,3.4vw,var(--fs-h2));line-height:var(--lh-tight);font-weight:var(--fw-regular);letter-spacing:var(--ls-heading);color:var(--forest-800)">Classes For Every Level</span></div>
    <div style=${typeRow}><span style=${typeLabel}>Card title<br/>600 · 26 / 1.25</span><span style="font-size:var(--fs-h3);line-height:var(--lh-snug);font-weight:var(--fw-semibold);letter-spacing:-.02em;color:var(--ink-900)">Morning Flow</span></div>
    <div style=${typeRow}><span style=${typeLabel}>Lead, two-tone<br/>400 · 22 / 1.5</span><span style="font-size:clamp(18px,2vw,var(--fs-lead));line-height:1.5;letter-spacing:-.03em;color:var(--forest-800);max-width:640px;text-wrap:pretty">A slow, grounding practice to open the hips. <span style="color:var(--sage-700)">Keep a block and a blanket nearby, and move at the pace of your breath.</span></span></div>
    <div style=${typeRow}><span style=${typeLabel}>Body<br/>400 · 16 / 1.5</span><span style="font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body);max-width:60ch;text-wrap:pretty">Each lesson is filmed in natural light and can be watched on any screen. Pause, rewind or pick up where you left off.</span></div>
    <div style=${typeRow + ';border-bottom:1px solid var(--line)'}><span style=${typeLabel}>Eyebrow<br/>700 · 14 · upper</span><${Eyebrow}>Featured Classes<//></div>
  </div>
</section>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>03 · Buttons<//>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <${Button} variant="primary" size="lg">Book a Free Class<//>
    <${Button} variant="dark" size="lg">Start Practising<//>
    <${Button} variant="outline" size="lg">Browse Classes<//>
    <${Button} variant="tint" size="lg">Send Message<//>
    <${Button} variant="primary" size="lg" disabled>Disabled<//>
  </div>
  <div style="border-radius:var(--radius-sm);background:var(--forest-700);padding:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <${Button} variant="light" size="lg">Join Class Now<//>
    <${Button} variant="outline-light" size="lg" icon="play">Watch Demo<//>
    <span style="font-size:var(--fs-small);color:var(--text-on-dark);flex:1;min-width:200px">Light and outline-light variants sit on photography or forest.</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;font-size:var(--fs-small);line-height:1.5;color:var(--sage-700)">
    <div><strong style="font-weight:var(--fw-semibold);color:var(--ink-900)">Primary</strong> — sage, one per section. Dark text on sage passes AA.</div>
    <div><strong style="font-weight:var(--fw-semibold);color:var(--ink-900)">Dark</strong> — nav CTA and forms where sage would fade into the section.</div>
    <div><strong style="font-weight:var(--fw-semibold);color:var(--ink-900)">Outline</strong> — the quieter alternative next to a primary.</div>
    <div><strong style="font-weight:var(--fw-semibold);color:var(--ink-900)">60px / 46px</strong> — both clear the 44px touch minimum.</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <span style="font-size:var(--fs-small);font-weight:var(--fw-semibold);color:var(--ink-900)">Icon buttons & play control</span>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
      <${IconButton} icon="arrow-right" variant="dark" label="Open" />
      <${IconButton} icon="arrow-left" variant="light" label="Back" style=${{ border: '1px solid var(--line)' }} />
      <div style="border-radius:var(--radius-sm);background:var(--forest-700);padding:18px;display:flex;gap:18px;align-items:center">
        <${IconButton} icon="envelope-simple" iconSet="fill" variant="glass" label="Email" />
        <${PlayButton} size=${96} />
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <span style="font-size:var(--fs-small);font-weight:var(--fw-semibold);color:var(--ink-900)">Filter chips <span style="font-weight:var(--fw-regular);color:var(--sage-700)">— new, built from button tokens</span></span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${chipLabels.map(label => {
        const on = chip === label;
        return html`<button key=${label} type="button" aria-pressed=${on} onClick=${() => setChip(label)} style="height:46px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid ${on ? 'var(--ink-900)' : 'var(--gray-300)'};background:${on ? 'var(--ink-900)' : 'transparent'};color:${on ? 'var(--white)' : 'var(--ink-900)'};font-family:var(--font-sans);font-size:var(--fs-small);font-weight:var(--fw-medium);letter-spacing:var(--ls-body);cursor:pointer;transition:background var(--dur-fast) var(--ease-out)">${label}</button>`;
      })}
    </div>
  </div>
</section>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>04 · Inputs<//>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px">
    <label style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:var(--fs-small);font-weight:var(--fw-medium);color:var(--ink-900)">Email</span>
      <${Input} tone="light" placeholder="you@example.com" />
      <span style=${note}>Default · click to see focus</span>
    </label>
    <label style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:var(--fs-small);font-weight:var(--fw-medium);color:var(--ink-900)">Password</span>
      <div style="position:relative">
        <${Input} tone="light" type=${showPw ? 'text' : 'password'} value="lotus2026" readOnly style=${{ paddingRight: 80 }} />
        <button onClick=${() => setShowPw(v => !v)} type="button" style="position:absolute;right:8px;top:8px;height:44px;padding:0 14px;border:0;background:transparent;font-family:var(--font-sans);font-size:var(--fs-small);font-weight:var(--fw-semibold);color:var(--forest-800);cursor:pointer">${showPw ? 'Hide' : 'Show'}</button>
      </div>
      <span style=${note}>At least 8 characters</span>
    </label>
    <label style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:var(--fs-small);font-weight:var(--fw-medium);color:var(--ink-900)">Email</span>
      <${Input} tone="light" value="thu@gmial" readOnly aria-invalid="true" style=${{ border: '1.5px solid var(--error)' }} />
      <span style="font-size:13px;line-height:1.4;font-weight:var(--fw-medium);color:var(--error);display:flex;gap:8px;align-items:center"><${Icon} name="warning-circle" set="fill" size=${16} color="var(--error)" />Enter a valid email, like name@example.com</span>
    </label>
  </div>
  <div role="alert" style="background:#f8ebe7;border-radius:var(--radius-sm);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;max-width:560px">

  </div>
</section>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>05 · Cards<//>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;align-items:start">

      <${ClassCard} location="Hatha · Beginner · 28 min" title="Morning Flow" />
      <span style=${note}>ClassCard · photo slot empty until real images arrive</span>
    </div>

      <div style="border:1px solid var(--border-card);border-radius:var(--radius-xs);overflow:hidden;background:var(--sage-100);display:flex;flex-direction:column">

          <div style="width:58px;height:58px;border-radius:var(--radius-pill);background:var(--white);display:flex;align-items:center;justify-content:center"><${Icon} name="lock-simple" set="fill" size=${22} color="var(--ink-900)" /></div>
          <span style="font-size:13px;font-weight:var(--fw-medium);color:var(--forest-800)">Members only</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 24px 14px">
          <div><div style="font-size:14px;color:var(--sage-700)">Vinyasa · Intermediate · 45 min</div><div style="font-size:var(--fs-h3);font-weight:var(--fw-semibold);letter-spacing:-.02em;color:var(--ink-900);margin-top:2px">Strength & Balance</div></div>
        </div>
      </div>
      <span style=${note}>Locked variant · new, follows ClassCard</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="background:var(--surface-tint);border-radius:var(--radius-sm);padding:32px;display:flex;flex-direction:column;gap:28px">
        <div style="display:flex;gap:4px" role="img" aria-label="5 out of 5 stars">${[1, 2, 3, 4, 5].map(i => html`<${Icon} key=${i} name="star" set="fill" size=${18} color="var(--star)" />`)}</div>
        <p style="margin:0;font-size:24px;line-height:1.35;letter-spacing:var(--ls-heading);font-weight:var(--fw-regular);color:var(--forest-800);text-wrap:pretty">“Twenty minutes before work and my back finally stopped aching.”</p>
        <div style="display:flex;align-items:center;gap:12px;padding-top:20px;border-top:1px solid var(--border-card)"><div style="width:44px;height:44px;border-radius:var(--radius-pill);background:var(--sage-200)"></div><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:var(--fw-semibold);color:var(--ink-900)">Hannah R.</span><span style=${note}>Member since 2024</span></div></div>
      </div>
      <span style=${note}>Testimonial · benefit-card surface, star gold accent</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;max-width:560px">
    <span style="font-size:var(--fs-small);font-weight:var(--fw-semibold);color:var(--ink-900)">Lesson list <span style="font-weight:var(--fw-regular);color:var(--sage-700)">— new, numbered rows with hairline dividers</span></span>
    <div style="display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--sage-100);border-radius:var(--radius-sm)">
        <div style="flex:none;width:46px;height:46px;border-radius:var(--radius-pill);background:var(--ink-900);display:flex;align-items:center;justify-content:center"><${Icon} name="play" set="fill" size=${16} color="var(--white)" /></div>

</section>

<section style="display:flex;flex-direction:column;gap:36px">
  <${Eyebrow}>06 · Navbar<//>
  <div style="position:relative;border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow:hidden;background:var(--forest-500);padding:28px clamp(16px,3vw,40px) 120px">
    <div style="position:absolute;inset:0;background:var(--overlay-hero)"></div>
    <span style="position:absolute;right:20px;bottom:16px;font-size:12px;font-weight:var(--fw-semibold);text-transform:uppercase;color:var(--text-on-dark-muted)">Hero photo</span>
    <div style="position:relative;overflow-x:auto">
      <${NavBar} links=${navLinks} active="Classes" />
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
    <div style="width:375px;max-width:100%;border-radius:var(--radius-lg);overflow:hidden;background:var(--forest-500);position:relative;min-height:${menuOpen ? '440px' : '200px'}">
      <div style="position:absolute;inset:0;background:var(--overlay-hero)"></div>
      <div style="position:relative;padding:14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div style=${'height:50px;padding:0 20px;border-radius:var(--radius-pill);display:flex;align-items:center;' + glass}><${Wordmark} scale=${0.9} /></div>
          <button onClick=${() => setMenuOpen(v => !v)} aria-label="Menu" aria-expanded=${menuOpen} style=${'width:50px;height:50px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;cursor:pointer;' + glass}><${Icon} name=${menuOpen ? 'x' : 'list'} size=${22} color="var(--forest-900)" /></button>
        </div>
        ${menuOpen && html`
        <div style="background:var(--paper);border-radius:var(--radius-lg);padding:12px 20px 20px;display:flex;flex-direction:column">
          ${navLinks.map(l => html`<a key=${l} href="#" style="font-size:30px;line-height:1;font-weight:var(--fw-light);letter-spacing:var(--ls-heading);color:var(--forest-800);text-decoration:none;padding:16px 0;border-bottom:1px solid var(--line)">${l}</a>`)}
          <div style="margin-top:20px"><${Button} variant="dark" size="lg" fullWidth>Book a Free Class<//></div>
        </div>`}
      </div>
    </div>
    <p style="margin:0;flex:1;min-width:240px;max-width:380px;font-size:var(--fs-small);line-height:1.6;color:var(--sage-700)">Desktop uses the NavBar component unchanged. On phones it collapses to the glass wordmark pill and a round menu button; the menu opens as a paper sheet with large light links and the one primary action. Tap the menu button to toggle.</p>
  </div>
</section>

<section style="background:var(--sage-100);border-radius:var(--radius-sm);padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;gap:20px;max-width:820px">
  <${Eyebrow}>For Your Feedback<//>
  <p style="margin:0;font-size:clamp(22px,2.4vw,28px);line-height:1.35;letter-spacing:var(--ls-heading);color:var(--forest-800);text-wrap:pretty">Three things to confirm before the pages: <span style="color:var(--sage-700)">light 300 headlines instead of the system’s 500, star gold as the one accent, and the new filter chip, locked card and lesson list patterns.</span></p>
</section>

</div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(StyleGuide));
</script>
</body>
</html>
